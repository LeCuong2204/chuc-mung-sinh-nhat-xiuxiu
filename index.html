<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Công Chúa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
        }
        .romantic-font {
            font-family: 'Dancing Script', cursive;
        }
        .floating-heart {
            position: absolute;
            animation: floatUp 4s ease-in-out infinite;
            opacity: 0.7;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        .sparkle {
            position: absolute;
            animation: twinkle 2s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .celebration-scene {
            position: relative;
            isolation: isolate;
        }
        .flower-field {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .celebration-active #particles {
            visibility: hidden;
        }
        .flower-field span {
            position: absolute;
            display: block;
            font-size: 1.75rem;
            opacity: 0.75;
            filter: drop-shadow(0 3px 5px rgba(190, 24, 93, 0.18));
            animation: flowerDrift 4.8s ease-in-out infinite;
        }
        .flower-field span:nth-child(1) { left: -0.25rem; top: 0; }
        .flower-field span:nth-child(2) { right: -0.25rem; top: 0; animation-delay: -1.2s; }
        .flower-field span:nth-child(3) { left: 8%; bottom: 2%; font-size: 1.25rem; animation-delay: -2.4s; }
        .flower-field span:nth-child(4) { right: 9%; bottom: 0; animation-delay: -3.1s; }
        .flower-field span:nth-child(5) { left: 24%; top: 2%; font-size: 1.1rem; animation-delay: -0.8s; }
        .flower-field span:nth-child(6) { right: 24%; top: 1%; font-size: 1.2rem; animation-delay: -2s; }
        .celebration-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .celebration-title,
        .celebration-action {
            animation: celebrationReveal 800ms cubic-bezier(.2,.8,.2,1) both;
        }
        .celebration-action { animation-delay: 240ms; }
        .gift-mark {
            animation: giftBob 2.8s ease-in-out infinite;
            filter: drop-shadow(0 8px 10px rgba(190, 24, 93, 0.16));
        }
        @keyframes flowerDrift {
            0%, 100% { opacity: 0.45; transform: translateY(2px) rotate(-9deg) scale(.92); }
            50% { opacity: 0.9; transform: translateY(-12px) rotate(12deg) scale(1.08); }
        }
        @keyframes celebrationReveal {
            from { opacity: 0; transform: translateY(16px) scale(.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes giftBob {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-9px) rotate(3deg); }
        }
        .cake-piece {
            transform: scaleY(0);
            transform-origin: bottom;
            opacity: 0;
        }
        .cake-build .cake-piece {
            animation: buildCake 650ms cubic-bezier(.2,.8,.2,1) forwards;
        }
        .cake-build .cake-base { animation-delay: 150ms; }
        .cake-build .cake-middle { animation-delay: 500ms; }
        .cake-build .cake-upper { animation-delay: 850ms; }
        .cake-build .cake-candle { animation-delay: 1200ms; }
        .cake-build .cake-fruit { animation-delay: 1450ms; }
        .cake-build .cake-platform { animation-delay: 0ms; }
        .cake-candle-group { transform-origin: bottom; }
        .cake-build .cake-candle-group { animation: candleArrive 550ms 1200ms cubic-bezier(.2,.8,.2,1) both; }
        .cake-flame { animation: flameFlicker 900ms ease-in-out infinite alternate; }
        .cake-flame:nth-child(2) { animation-delay: 180ms; }
        .cake-flame:nth-child(3) { animation-delay: 320ms; }
        .cake-glow { animation: glowPulse 1800ms ease-in-out infinite; }
        .music-button {
            position: fixed;
            right: max(1rem, env(safe-area-inset-right));
            bottom: max(1rem, env(safe-area-inset-bottom));
            z-index: 40;
            width: 3.25rem;
            aspect-ratio: 1;
            border: 1px solid #fda4af;
            border-radius: 50%;
            background: #e11d48;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 8px 24px rgba(190, 24, 93, 0.25);
            cursor: pointer;
        }
        .music-button:hover { background: #be123c; }
        .music-button:focus-visible,
        .music-button:focus-visible {
            outline: 3px solid #9f1239;
            outline-offset: 3px;
        }
        .music-button.is-playing { background: #be123c; }
        @keyframes buildCake {
            0% { transform: translateY(14px) scaleY(0); opacity: 0; }
            70% { transform: translateY(-2px) scaleY(1.05); opacity: 1; }
            100% { transform: translateY(0) scaleY(1); opacity: 1; }
        }
        @keyframes candleArrive {
            0% { transform: translateY(-24px) scale(.75); opacity: 0; }
            75% { transform: translateY(3px) scale(1.04); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes flameFlicker {
            from { transform: scale(.88, 1) rotate(-4deg); }
            to { transform: scale(1.08, 1.12) rotate(4deg); }
        }
        @keyframes glowPulse {
            0%, 100% { opacity: .25; transform: scale(.92); }
            50% { opacity: .65; transform: scale(1.08); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body class="bg-[#fff0f3] min-h-screen flex items-center justify-center overflow-x-hidden relative selection:bg-pink-200 p-4">

    <!-- Hiệu ứng trái tim & ánh sáng bay nền -->
    <div id="particles" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Container chính -->
    <main class="relative z-10 w-full max-w-lg mx-auto flex flex-col items-center justify-center min-h-screen py-8">

        <!-- CHƯƠNG 1: NHẬP MẬT KHẨU NGÀY SINH -->
        <section id="chapter-1" class="w-full max-w-md bg-white/90 backdrop-blur-md p-8 rounded-[2.5rem] shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] border border-pink-100 flex flex-col items-center transition-all duration-700">
            <div class="w-28 h-28 rounded-3xl overflow-hidden shadow-inner mb-6 border-4 border-white ring-2 ring-pink-200 object-cover bg-white">
                <img src="anh1.jpg" alt="Công chúa" class="w-full h-full object-cover">

            <h2 class="text-2xl font-bold text-rose-700 mb-3 text-center">Nhập ngày sinh nha</h2>

            <div id="pin-dots" class="flex gap-2 sm:gap-3 mb-8">

                <div class="w-5 h-5 rounded-full border-2 border-rose-300 transition-all bg-white"></div>

                <div class="w-5 h-5 rounded-full border-2 border-rose-300 transition-all bg-white"></div>
                <div class="w-5 h-5 rounded-full border-2 border-rose-300 transition-all bg-white"></div>
                <div class="w-5 h-5 rounded-full border-2 border-rose-300 transition-all bg-white"></div>

            <div class="grid grid-cols-3 gap-4 w-full">

                <button onclick="pressNum('4')" class="py-4 bg-pink-50 hover:bg-pink-100 rounded-2xl text-rose-700 font-bold text-xl shadow-sm transition-transform active:scale-95">4</button>
                <button onclick="pressNum('5')" class="py-4 bg-pink-50 hover:bg-pink-100 rounded-2xl text-rose-700 font-bold text-xl shadow-sm transition-transform active:scale-95">5</button>
                <button onclick="pressNum('6')" class="py-4 bg-pink-50 hover:bg-pink-100 rounded-2xl text-rose-700 font-bold text-xl shadow-sm transition-transform active:scale-95">6</button>
                <button onclick="pressNum('7')" class="py-4 bg-pink-50 hover:bg-pink-100 rounded-2xl text-rose-700 font-bold text-xl shadow-sm transition-transform active:scale-95">7</button>
                <button onclick="pressNum('8')" class="py-4 bg-pink-50 hover:bg-pink-100 rounded-2xl text-rose-700 font-bold text-xl shadow-sm transition-transform active:scale-95">8</button>
                <button onclick="pressNum('9')" class="py-4 bg-pink-50 hover:bg-pink-100 rounded-2xl text-rose-700 font-bold text-xl shadow-sm transition-transform active:scale-95">9</button>
                <button onclick="clearPin()" class="py-4 bg-stone-100 hover:bg-stone-200 rounded-2xl text-stone-600 font-semibold text-lg transition-transform active:scale-95">Xóa</button>
                <button onclick="pressNum('0')" class="py-4 bg-pink-50 hover:bg-pink-100 rounded-2xl text-rose-700 font-bold text-xl shadow-sm transition-transform active:scale-95">0</button>
                <button onclick="submitPin()" class="py-4 bg-rose-500 hover:bg-rose-600 rounded-2xl text-white font-bold text-lg shadow-md transition-transform active:scale-95">OK</button>
            </div>
        </section>

        <!-- CHƯƠNG 2: LỜI CHÀO MỞ ĐẦU -->
        <section id="chapter-2" class="celebration-scene hidden w-full max-w-md text-center py-12 transition-opacity duration-1000">
            <div class="flower-field" aria-hidden="true">
                <span>🌸</span><span>🌷</span><span>✨</span><span>🌼</span><span>💮</span><span>✨</span>
            </div>
            <div class="celebration-content">
                <h1 class="celebration-title romantic-font text-5xl sm:text-6xl text-rose-700 drop-shadow-sm mb-8 leading-tight">Hôm nay là sinh nhật của em...</h1>
                <button onclick="nextChapter(3)" class="celebration-action mt-4 px-8 py-4 bg-rose-500 text-white rounded-full font-bold text-lg shadow-lg hover:bg-rose-600 transition transform hover:scale-105">Tiếp tục khám phá ❤️</button>
            </div>
        </section>

        <!-- CHƯƠNG 3: MÓN QUÀ NHỎ -->
        <section id="chapter-3" class="celebration-scene hidden w-full max-w-md text-center py-8 transition-opacity duration-1000">
            <div class="flower-field" aria-hidden="true">
                <span>🌷</span><span>🌸</span><span>✨</span><span>🌼</span><span>💮</span><span>✨</span>
            </div>
            <div class="celebration-content">
                <div class="gift-mark text-6xl mb-6" aria-hidden="true">🎁</div>
                <h2 class="celebration-title romantic-font text-4xl sm:text-5xl text-rose-700 mb-6 leading-tight">Anh có một món quà nhỏ gửi tặng em</h2>
                <button onclick="nextChapter(4); buildCake();" class="celebration-action mt-4 px-8 py-4 bg-rose-500 text-white rounded-full font-bold text-lg shadow-lg hover:bg-rose-600 transition transform hover:scale-105">Mở món quà 🎀</button>
            </div>
        </section>

        <!-- CHƯƠNG 4: BÁNH KEM SINH NHẬT -->
        <section id="chapter-4" class="hidden w-full max-w-md text-center py-8 transition-opacity duration-1000 flex flex-col items-center">
            <h2 class="romantic-font text-4xl text-rose-700 mb-8">Chúc mừng sinh nhật em! 🎂</h2>
            <div class="relative bg-gradient-to-b from-white/90 to-pink-50/80 px-6 pt-8 pb-7 rounded-[2rem] shadow-lg border border-pink-100 mb-8 w-80 max-w-full flex flex-col items-center">
                <div class="cake-glow absolute top-9 left-1/2 -translate-x-1/2 w-48 h-40 rounded-full bg-rose-200/70 blur-2xl pointer-events-none" aria-hidden="true"></div>
                <div id="birthday-cake" class="relative z-10 w-56 h-52 flex flex-col items-center justify-end" aria-label="Bánh sinh nhật ba tầng">
                    <div class="cake-piece cake-platform absolute bottom-0 w-56 h-5 rounded-[50%] bg-gradient-to-b from-amber-100 to-rose-200 shadow-[0_8px_14px_rgba(190,24,93,0.18)]"></div>
                    <div class="cake-piece cake-base absolute bottom-2 w-52 h-16 rounded-b-2xl rounded-t-xl bg-gradient-to-b from-rose-300 via-pink-300 to-rose-400 shadow-md">
                        <div class="absolute inset-x-0 top-0 h-3 rounded-t-xl bg-rose-100 shadow-sm"></div>
                        <div class="absolute inset-x-0 top-5 h-1 bg-white/35"></div>
                        <span class="absolute left-8 top-8 text-sm">♥</span><span class="absolute right-8 top-8 text-sm">♥</span>
                    </div>
                    <div class="cake-piece cake-middle absolute bottom-[3.25rem] w-44 h-14 rounded-t-xl rounded-b-lg bg-gradient-to-b from-amber-200 via-orange-100 to-amber-300 shadow-md">
                        <div class="absolute inset-x-0 top-0 h-3 rounded-t-xl bg-white/90"></div>
                        <span class="absolute left-5 top-6 w-2 h-2 rounded-full bg-rose-400"></span><span class="absolute left-12 top-8 w-2 h-2 rounded-full bg-pink-500"></span><span class="absolute right-12 top-6 w-2 h-2 rounded-full bg-rose-400"></span><span class="absolute right-5 top-8 w-2 h-2 rounded-full bg-pink-500"></span>
                    </div>
                    <div class="cake-piece cake-upper absolute bottom-[6.5rem] w-36 h-12 rounded-t-xl rounded-b-lg bg-gradient-to-b from-pink-200 via-rose-200 to-pink-300 shadow-md">
                        <div class="absolute inset-x-0 top-0 h-3 rounded-t-xl bg-white/90"></div>
                        <span class="absolute left-5 top-6 text-xs text-rose-600">✿</span><span class="absolute right-5 top-6 text-xs text-rose-600">✿</span>
                    </div>
                    <div id="candle" class="cake-candle-group absolute bottom-[9.25rem] z-20 w-20 h-12 flex items-end justify-center gap-2 cursor-pointer rounded-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-rose-500" onclick="blowCandle()" role="button" aria-label="Chạm vào nến để thổi" tabindex="0" onkeydown="if(event.key === 'Enter' || event.key === ' ') blowCandle()">
                        <span class="relative w-3 h-8 rounded-t-sm rounded-b bg-gradient-to-r from-rose-300 via-white to-rose-300 border border-rose-200">
                            <span id="flame" class="cake-flame absolute -top-5 left-1/2 -translate-x-1/2 w-4 h-5 rounded-full bg-amber-400 shadow-[0_0_12px_#fbbf24]"></span>
                        </span>
                        <span class="relative w-3 h-10 rounded-t-sm rounded-b bg-gradient-to-r from-amber-300 via-white to-amber-300 border border-amber-200">
                            <span class="cake-flame absolute -top-5 left-1/2 -translate-x-1/2 w-4 h-5 rounded-full bg-orange-400 shadow-[0_0_12px_#fb923c]"></span>
                        </span>
                        <span class="relative w-3 h-8 rounded-t-sm rounded-b bg-gradient-to-r from-pink-300 via-white to-pink-300 border border-pink-200">
                            <span class="cake-flame absolute -top-5 left-1/2 -translate-x-1/2 w-4 h-5 rounded-full bg-amber-400 shadow-[0_0_12px_#fbbf24]"></span>
                        </span>
                    </div>
                    <div class="cake-piece cake-fruit absolute bottom-[9.5rem] z-10 text-xl" aria-hidden="true">🍓 <span class="text-base">🫐</span> 🍓</div>
                </div>
            </div>
            <p id="candle-text" class="text-base text-rose-600 mb-6 italic font-medium">Hãy chạm vào ngọn nến để thổi nến nhé!</p>
            <button id="btn-to-5" onclick="nextChapter(5); startTypewriter();" class="hidden px-8 py-4 bg-rose-500 text-white rounded-full font-bold text-lg shadow-lg hover:bg-rose-600 transition transform hover:scale-105">Đọc thư tình của anh ✨</button>
        </section>

        <!-- CHƯƠNG 5: BỘ SƯU TẬP ẢNH & THƯ TÌNH -->
        <section id="chapter-5" class="hidden w-full max-w-lg bg-white/95 backdrop-blur-md p-5 sm:p-8 rounded-3xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.1)] border border-pink-100 flex flex-col items-center transition-all duration-700 my-6">
            <h3 class="romantic-font text-3xl text-rose-700 mb-8 flex items-center gap-3">Gửi Em 💌</h3>
            
            <!-- Hai ảnh Polaroid -->
            <div class="grid grid-cols-2 gap-6 mb-10 w-full">
                <div class="bg-white p-3 pb-8 rounded-2xl shadow-xl border border-stone-100 transform -rotate-3 hover:rotate-0 transition duration-500 ease-out hover:shadow-2xl">

                </div>
                <div class="bg-white p-3 pb-8 rounded-2xl shadow-xl border border-stone-100 transform rotate-3 hover:rotate-0 transition duration-500 ease-out hover:shadow-2xl">
                    <img src="anh2.jpg" alt="Ảnh 2" class="w-full h-44 object-cover rounded-xl shadow-inner">
                </div>
            </div>

            <!-- Khung thư chữ chạy (ĐÃ SỬA LỖI) -->
            <div class="w-full bg-[#fdf2f8]/80 p-5 sm:p-6 rounded-2xl border border-pink-100 shadow-inner text-stone-700 text-base leading-8 font-medium text-left">
                <p id="typewriter-text" class="whitespace-pre-line font-medium text-stone-800 break-words"></p>
            </div>

    </main>

    <audio id="birthday-music" src="snaptik.vn_7415566497994558741.mp3" preload="auto" loop></audio>
    <button id="music-button" class="music-button" type="button" aria-label="Phát nhạc" title="Phát nhạc" hidden>♫</button>

    <script>
        // === CÁC HÀM XỬ LÝ CHUNG ===
        
        // Hiệu ứng trái tim & ánh sáng bay nền
        const particlesContainer = document.getElementById('particles');
        const emojis = ['❤️', '💖', '✨', '🌸', '🌷', '⭐'];
        for (let i = 0; i < 25; i++) {
            const span = document.createElement('span');
            span.className = 'floating-heart';
            span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            span.style.left = Math.random() * 100 + 'vw';
            span.style.top = (Math.random() * 70 + 30) + 'vh';
            span.style.fontSize = (Math.random() * 15 + 15) + 'px';
            span.style.animationDuration = (Math.random() * 4 + 4) + 's';
            span.style.animationDelay = (Math.random() * 4) + 's';
            particlesContainer.appendChild(span);
        }

        // Logic chuyển chương
        function nextChapter(step) {
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
            const target = document.getElementById(`chapter-${step}`);
            target.classList.remove('hidden');
            document.body.classList.toggle('celebration-active', step === 2 || step === 3);
            document.getElementById('music-button').hidden = step < 2;
            // Cuộn lên đầu trang khi chuyển chương
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        const birthdayMusic = document.getElementById('birthday-music');
        const musicButton = document.getElementById('music-button');

        function updateMusicButton(isPlaying) {
            musicButton.textContent = isPlaying ? 'Ⅱ' : '♫';
            musicButton.setAttribute('aria-label', isPlaying ? 'Tạm dừng nhạc' : 'Phát nhạc');
            musicButton.title = isPlaying ? 'Tạm dừng nhạc' : 'Phát nhạc';
            musicButton.classList.toggle('is-playing', isPlaying);
        }

        function startBirthdayMusic() {
            birthdayMusic.play()
                .then(() => updateMusicButton(true))
                .catch(() => updateMusicButton(false));
        }

        musicButton.addEventListener('click', () => {
            if (birthdayMusic.paused) {
                startBirthdayMusic();
            } else {
                birthdayMusic.pause();
                updateMusicButton(false);
            }
        });

        // === CHƯƠNG 1: NHẬP PIN ===
        let currentPin = "";
        const correctPin = "10102005";

        function pressNum(num) {
            if (currentPin.length < correctPin.length) {
                currentPin += num;
                updateDots();
            }
        }

        function clearPin() {
            currentPin = "";
            updateDots();
            hideError();
        }

        function updateDots() {
            const dots = document.getElementById('pin-dots').children;
            for (let i = 0; i < dots.length; i++) {
                if (i < currentPin.length) {
                    dots[i].classList.add('bg-rose-500', 'border-rose-500', 'scale-110');
                } else {
                    dots[i].classList.remove('bg-rose-500', 'border-rose-500', 'scale-110');
                }
            }
        }

        function showError() {
            const err = document.getElementById('error-msg');
            err.classList.remove('opacity-0');
            setTimeout(() => {
                err.classList.add('opacity-0');
            }, 2000);
            currentPin = "";
            updateDots();
        }

        function hideError() {
            document.getElementById('error-msg').classList.add('opacity-0');
        }

        function submitPin() {
            if (currentPin === correctPin) {
                nextChapter(2);
                startBirthdayMusic();
            } else {
                showError();
            }
        }

        // === CHƯƠNG 3: THỔI NẾN ===
        function blowCandle() {
            const flame = document.getElementById('flame');
            if (flame.style.display === 'none') return;
            document.querySelectorAll('.cake-flame').forEach(cakeFlame => {
                cakeFlame.style.display = 'none';
            });
            document.getElementById('candle-text').innerText = "Tuyệt vời! 🔥 Chúc điều ước của em sớm thành hiện thực nhé!";
            document.getElementById('btn-to-5').classList.remove('hidden');
            
            // Hiệu ứng pháo giấy nhỏ khi thổi tắt nến
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.3 }
            });
        }

        function buildCake() {
            document.getElementById('birthday-cake').classList.remove('cake-build');
            void document.getElementById('birthday-cake').offsetWidth;
            document.getElementById('birthday-cake').classList.add('cake-build');
        }

        // === CHƯƠNG 4: THƯ TÌNH (GÕ CHỮ) ===
        const fullText = `Gửi Ming(xiuxiu)! ❤️

Hôm nay là một ngày vô cùng đặc biệt, ngày mà thiên thần đáng yêu nhất đã đến với thế giới này. Nhân dịp sinh nhật em, anh muốn gửi đến em những lời chúc chân thành và ngọt ngào nhất từ sâu thẳm trái tim mình.

Anh chúc em luôn luôn xinh đẹp, rạng rỡ như những bông hoa đang khoe sắc. Anh mong mọi điều tốt đẹp nhất sẽ đến với em: sức khỏe dồi dào, niềm vui đong đầy và hạnh phúc tràn ngập.

Cảm ơn em vì đã xuất hiện, mang đến cho cuộc sống của anh những gam màu tươi mới và những khoảnh khắc tuyệt vời nhất. Em chính là niềm vui lớn nhất của anh.

Dù thời gian quen nhau chưa lâu, chưa hiểu được nhiều về em nhưng anh thực sự mong muốn chúng mình sẽ có một tương lai thật đẹp!

Hãy cứ tin tưởng vào bản thân em, tự tin làm những điều mình muốn, vì anh tin em có thể làm được tất cả.! ❤️`;

        function startTypewriter() {
            const container = document.getElementById('typewriter-text');
            // Reset nội dung
            container.innerHTML = "";
            let i = 0;
            const speed = 12;

            function type() {
                if (i < fullText.length) {
                    const char = fullText.charAt(i);
                    // Xử lý xuống dòng tự động
                    if (char === '\n') {
                        container.textContent += char;
                    } else {
                        container.textContent += char;
                    }
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }
    </script>
